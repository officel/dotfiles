# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# home ディレクトリに配置してグローバルな作業を行う
# リポジトリに既に taskfile が存在する場合は `t -g` または `tg`

includes:
  repos:
    taskfile: Taskfile.private.yml
    flatten: true
    internal: false
    optional: true

# vars:

tasks:
  default:
    cmds:
      - echo "This is {{.TASKFILE}} at v{{.TASK_VERSION}}"
      - task --list --sort alphanumeric -t {{.TASKFILE}}
    silent: true

  up:auto:
    desc: "Update repository tools automatically"
    aliases:
      - auto
      - "= u and p"
    cmds:
      - task: up:work
      - task: up:push
    dir: "{{.USER_WORKING_DIR}}"

  up:work:
    desc: "Update repository tools"
    aliases:
      - u
    env:
      # GitHub CLI からトークンを取得
      GITHUB_TOKEN:
        sh: gh auth token
    cmds:
      - task: up:gr
      - task: up:config
      - task: up:aqua
      - task: up:pinact
      - task: up:zizmor
      - task: up:prek
      - task: up:gau
      - prek run -a
    dir: "{{.USER_WORKING_DIR}}"

  up:push:
    desc: "Bump tools version commit"
    aliases:
      - p
    vars:
      COMMIT_TITLE: "chore: bump tools version"
      BRANCH_NAME: "chore/bump-{{ date \"2006-01-02\" now}}"
      PR_BODY_FILE: "{{.TASKFILE_DIR}}/__bump_tool_pr_body.txt"
    cmds:
      - git add -u
      - git commit -m "{{.COMMIT_TITLE}}"
      - git push origin HEAD:refs/heads/{{.BRANCH_NAME}}
      - sleep 1
      - gh pr create -t "{{.COMMIT_TITLE}}" -F "{{.PR_BODY_FILE}}" -H "{{.BRANCH_NAME}}" -B "main"
      - sleep 1
      - gh pr merge "{{.BRANCH_NAME}}" --auto -s
      - git show
    dir: "{{.USER_WORKING_DIR}}"

  up:gr:
    cmds:
      - git fetch --all --prune
      - git checkout origin/HEAD
    dir: "{{.USER_WORKING_DIR}}"

  up:gau:
    cmds:
      - git status
      - git add -u
    dir: "{{.USER_WORKING_DIR}}"

  up:aqua:
    desc: "update aqua"
    cmds:
      - cmd: aqua up
        ignore_error: true
      - cmd: aqua upc -prune
        ignore_error: true
    dir: "{{.USER_WORKING_DIR}}"

  up:pinact:
    summary: |
      - `.github/workflows/` 下のワークフロー中の使用バージョンを更新
    cmds:
      - cmd: pinact run -u
        ignore_error: true
    dir: "{{.USER_WORKING_DIR}}"

  up:zizmor:
    summary: |
      - `.github/workflows/` 下のワークフローをチェック
    cmds:
      - cmd: zizmor .
        ignore_error: true
    dir: "{{.USER_WORKING_DIR}}"

  up:prek:
    desc: "run prek update --freeze"
    summary: |
      - .pre-commit-config.yaml を更新
      - include-tag, exclude-tag でセマンティックバージョニングに基づいたバージョン選択
      - `-rc` や `-alpha`, `-beta` を除外
    cmds:
      - cmd: prek update --freeze --include-tag 'v*.*.*' --exclude-tag '*-{alpha,beta,rc}*'
        ignore_error: true
    dir: "{{.USER_WORKING_DIR}}"

  up:config:
    summary: |
      設定ファイル類を最初に更新しておく
      配布が終わった処理は削除してもよい
    cmds:
      - cmd: sed -i 's/rhysd/kjanat/g' .pre-commit-config.yaml
        ignore_error: true
      - cmd: |
          sed -i 's/^\([[:space:]]*\)- id: ryl[[:space:]]*$/\1- id: ryl-check\n\1  args: ["--fix"]/' .pre-commit-config.yaml
        ignore_error: true
      - cmd: sed -i -E 's/^([[:space:]]*)\[rules(\.|\])/\1[lint.rules\2/' .config/ryl.toml
        ignore_error: true
      - cmd: sed -i -E 's/^([[:space:]]*)ignore([[:space:]]*=)/\1exclude\2/' .config/ryl.toml
        ignore_error: true
    dir: "{{.USER_WORKING_DIR}}"
